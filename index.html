<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRL HW1 Grid Map</title>
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>DRL HW1-1 to HW1-3</h1>
        </header>

        <section class="controls">
            <label for="grid-size">Grid Size (5-9):</label>
            <input type="number" id="grid-size" min="5" max="9" value="5">
            <button id="generate-btn">Generate Square</button>
        </section>

        <section class="grid-section">
            <h2 id="grid-title">5 x 5 Square:</h2>
            <p class="instruction" id="instruction-text">
                Click on cells to set Start (Green), End (Red), and Obstacles (Gray).
            </p>
            <div id="grid-container" class="grid-container"></div>

            <div class="action-panel" id="action-panel" style="display: none; gap: 10px; margin: 20px 0;">
                <button id="btn-hw1-2" class="action-btn">HW1-2: Evaluate Random Policy</button>
                <button id="btn-hw1-3" class="action-btn">HW1-3: Value Iteration</button>
            </div>

            <div class="status-panel">
                <span class="status-indicator">Please click to select Start Cell (Green)</span>
            </div>
        </section>
    </div>

    <script src="static/script.js"></script>
</body>

</html>
